# Requires an ingress controller (Minikube: `minikube addons enable ingress`;
# Docker Desktop: install ingress-nginx). Add "127.0.0.1 heart-risk.local" to /etc/hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-risk-api
  namespace: heart-risk
spec:
  ingressClassName: nginx
  rules:
    - host: heart-risk.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heart-risk-api
                port:
                  name: http
