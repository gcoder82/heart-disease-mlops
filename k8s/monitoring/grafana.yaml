apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: heart-risk
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: heart-risk
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: heart-risk
        folder: Heart Risk
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: heart-risk
type: Opaque
stringData:
  # Demo credentials - change for anything beyond a local cluster.
  admin-user: admin
  admin-password: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: heart-risk
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 472, fsGroup: 472}
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports: [{containerPort: 3000}]
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: {secretKeyRef: {name: grafana-admin, key: admin-user}}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: grafana-admin, key: admin-password}}
          readinessProbe: {httpGet: {path: /api/health, port: 3000}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: heart-risk
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
