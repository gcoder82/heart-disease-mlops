# type LoadBalancer: Docker Desktop publishes it on localhost:80;
# on Minikube run `minikube tunnel`; on GKE/EKS/AKS the cloud provisions a public IP.
apiVersion: v1
kind: Service
metadata:
  name: heart-risk-api
  namespace: heart-risk
  labels:
    app.kubernetes.io/name: heart-risk-api
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: heart-risk-api
  ports:
    - name: http
      port: 80
      targetPort: http
