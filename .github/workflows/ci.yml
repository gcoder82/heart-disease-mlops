name: MLOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: heart-risk-api

jobs:
  # ------------------------------------------------------------------ 1. lint
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.7.4
      - name: ruff check
        run: ruff check . --output-format=github

  # ------------------------------------------------------------------ 2. unit tests
  test:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (clean environment)
        run: pip install -r requirements-dev.txt
      - name: pytest with coverage
        run: |
          mkdir -p reports
          pytest --cov=heartrisk --cov-report=term-missing --cov-report=xml:reports/coverage.xml \
                 --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/junit.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: reports/coverage.xml
          if-no-files-found: ignore

  # ------------------------------------------------------------------ 3. data + EDA + training
  train:
    name: Data, EDA and model training
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Download dataset (falls back to the committed raw file)
        run: |
          python scripts/download_data.py --force || {
            echo "::warning::UCI download failed - using committed data/raw file"
            test -f data/raw/processed.cleveland.data
          }
      - name: Clean data
        run: python -m heartrisk.data prepare
      - name: EDA figures
        run: python -m heartrisk.eda
      - name: Train + track with MLflow
        run: python -m heartrisk.train --tracking-uri file:./mlruns
      - name: Show selected model
        run: python -c "import json;m=json.load(open('models/metadata.json'));print(json.dumps({k:m[k] for k in ('model_name','model_version','metrics')},indent=2))"
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/
      - uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns/
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/
            data/processed/

  # ------------------------------------------------------------------ 4. container build + verification
  docker:
    name: Docker build and smoke test
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: models/
      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:ci .
      - name: Run container
        run: docker run -d --name api -p 8000:8000 ${{ env.IMAGE_NAME }}:ci
      - name: Smoke test (/ready, /predict, 422, /metrics)
        run: bash scripts/smoke_test.sh
      - name: Collect container logs
        if: always()
        run: docker logs api > container.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-log
          path: container.log
      - name: Validate Kubernetes manifests and Helm chart
        run: |
          helm lint helm/heart-risk-api
          helm template hr helm/heart-risk-api > /dev/null
          kubectl kustomize k8s > /dev/null
          kubectl kustomize k8s/monitoring > /dev/null

  # ------------------------------------------------------------------ 5. publish (main only)
  publish:
    name: Push image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: models/
      - name: Lower-case the registry owner (GHCR requires it)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/heart-risk-api:latest
            ghcr.io/${{ env.OWNER }}/heart-risk-api:${{ github.sha }}
